name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build both loaders with Gradle
        run: ./gradlew :fabric:build :neoforge:build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: simpletrading-jars
          # Upload only the main jars (exclude dev/sources/shadow)
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-dev.jar
            !**/*-shadow.jar
            !**/*-sources.jar
          retention-days: 7

  # Cuts the GitHub release AND mirrors it to Modrinth + CurseForge in one job.
  #
  # Deliberately a single job rather than a second workflow fired by `release: published`:
  # releases created with the built-in GITHUB_TOKEN do not emit events that start new
  # workflow runs, so the split version would need a PAT. Everything the platform uploads
  # need (both jars, the changelog) is already on disk here, so there is nothing to gain
  # from the split.
  #
  # Requires repo secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 pulls full history + all tags so we can diff against the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Guard: the tag must match mod_version, or the released jars would report the
      # wrong version to the loader / update-checker. Fail fast instead of shipping drift.
      - name: Verify tag matches mod_version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROP="$(grep -E '^mod_version' gradle.properties | sed -E 's/.*=[[:space:]]*//')"
          if [ "$TAG" != "$PROP" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG) does not match gradle.properties mod_version ($PROP). Bump gradle.properties and re-tag."
            exit 1
          fi

      # Version drives the jar filenames; MC version becomes the platform game-version tag.
      # Both are read at the tag, so they describe what this release was actually built against.
      - name: Resolve versions
        id: vers
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          MC="$(grep -E '^minecraft_version' gradle.properties | sed -E 's/.*=[[:space:]]*//')"
          echo "minecraft=$MC" >> "$GITHUB_OUTPUT"
          echo "Releasing ${GITHUB_REF_NAME} for MC $MC"

      - name: Build both jars
        run: ./gradlew :fabric:build :neoforge:build

      # Copy the exact main jars by version so sources/dev jars are never picked up.
      - name: Collect release jars
        run: |
          VERSION="${{ steps.vers.outputs.version }}"
          mkdir -p release-jars
          cp "fabric/build/libs/simpletrading-fabric-${VERSION}.jar" release-jars/
          cp "neoforge/build/libs/simpletrading-neoforge-${VERSION}.jar" release-jars/

      # Build the release body from every commit since the previous tag.
      # GitHub's built-in generate_release_notes is PR-based and produces an empty
      # list for our tagging flow (tags cut from direct commits, no PRs in range),
      # so we assemble the changelog from the git log instead.
      # The same file is reused as the changelog on all three platforms.
      - name: Build changelog
        run: |
          TAG="$GITHUB_REF_NAME"
          # Nearest tag reachable from this tag's parent; empty on the very first release.
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
              echo
              echo
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              git log --no-merges --pretty=format:'- %s (%h)' "${TAG}"
            fi
          } > release-notes.md
          echo "----- generated release notes -----"
          cat release-notes.md

      - name: Create release and attach jars
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          fail_on_unmatched_files: true
          body_path: release-notes.md

      # One upload per loader, so each jar is its own version carrying only its own
      # loader tag. Both keep the plain version number: Modrinth allows two versions
      # to share a version number.
      #
      # github-token is deliberately omitted in both steps: the release already exists,
      # mc-publish only needs to touch Modrinth and CurseForge.
      #
      # Fabric API is a hard `depends` entry in fabric.mod.json, so it is declared
      # required here. The NeoForge build has no external mod dependencies.
      # CurseForge relations are keyed by SLUG; a numeric id gets resolved via the
      # Eternal API and silently dropped if that lookup fails, so slugs are used there.
      - name: Publish Fabric
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: AIX3SW2N
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false

          curseforge-id: 1471179
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: release-jars/simpletrading-fabric-*.jar
          name: "Simple Trading ${{ steps.vers.outputs.version }}"
          version: ${{ steps.vers.outputs.version }}
          version-type: release
          changelog-file: release-notes.md

          loaders: fabric
          game-versions: ${{ steps.vers.outputs.minecraft }}

          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:fabric-api}

      - name: Publish NeoForge
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: AIX3SW2N
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false

          curseforge-id: 1471179
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: release-jars/simpletrading-neoforge-*.jar
          name: "Simple Trading ${{ steps.vers.outputs.version }}"
          version: ${{ steps.vers.outputs.version }}
          version-type: release
          changelog-file: release-notes.md

          loaders: neoforge
          game-versions: ${{ steps.vers.outputs.minecraft }}
